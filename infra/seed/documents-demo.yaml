# 日報のサンプル。Document Resource Server の `documents` に入る。
#
# 何のために要るか: この画面の入口は「自動化できそうな作業を探す」で、その入力は
# 本人のドキュメントである(T-APP-04)。記録が1件も無いプロジェクトでは候補が0件になり、
# 「必要な権限を調べる」まで辿り着けない。
#
# 何を書くか: `testuser` が持っている権限(infra/seed/human-permissions.yaml の
# document.read / document.write)で実際にできる作業だけを書く。読んで書くだけの
# 繰り返し作業なので、Authorization Platform の判断は document の2件に落ち、
# 提示される権限が空にならない。Capability 識別子そのものは書かない —
# それを決めるのは Authorization Platform であって記録ではない(RULE-07)。
#
# 日付は `occurred_days_ago` で置く。Job が実行時刻から解いて `occurred_at` にするので、
# 再 seed するたびに既定の7日間の窓へ入り直す。`document_id` は行の内容から導くため、
# 再 seed は同じ7件を書き直すだけで増えない。
- owner_subject: testuser
  type: daily_report
  title: 日報 2026-09-04 週次レポートの取りまとめ
  occurred_days_ago: 1
  body: |
    午前は各チームの作業記録ドキュメントを開いて、先週から進んだ項目を拾った。
    毎週おなじ4つのドキュメントを順番に読み、見出しごとに要点を1行へ縮めている。
    午後はそれを週次レポートのドキュメントに書き写した。
    数字の転記だけは合っているか自分で見直している。
    この読み取りと書き写しは毎週金曜に必ず発生していて、内容よりも往復に時間がかかっている。
- owner_subject: testuser
  type: daily_report
  title: 日報 2026-09-03 議事録の清書
  occurred_days_ago: 2
  body: |
    定例会議の下書きドキュメントを読み、決まったことと持ち帰りに分けて書き直した。
    下書きは発言の順に並んでいるので、毎回おなじ形へ整え直す手間がかかる。
    整えたものは共有ドキュメントとして新しく作成し、元の下書きには手を入れないでおいた。
    持ち帰りの担当者名だけは、あとで本人に確認してから確定させたい。
- owner_subject: testuser
  type: daily_report
  title: 日報 2026-09-02 問い合わせ対応メモの整理
  occurred_days_ago: 3
  body: |
    問い合わせ対応のメモが日付ごとにばらばらのドキュメントへ散っていたので、内容を読んで種類ごとにまとめた。
    同じ質問が月に何度も来ていることが読み取れたため、よくある質問のドキュメントへ追記した。
    追記した箇所は色を変えて、あとから見て分かるようにしている。
    ばらばらのメモを読む作業が毎日30分ほどかかっている。
- owner_subject: testuser
  type: daily_report
  title: 日報 2026-09-01 月初の資料棚卸し
  occurred_days_ago: 4
  body: |
    月初なので、前月に更新された資料をすべて開いて、内容が古いままのものを洗い出した。
    古いと判断したものは一覧のドキュメントへ書き出し、担当者に見てもらう形にした。
    実際に中身を直すのは担当者なので、こちらは読むことと一覧を作ることまでにとどめている。
    毎月おなじ手順で、開くドキュメントの数だけ時間がかかる。
- owner_subject: testuser
  type: daily_report
  title: 日報 2026-08-29 手順書の更新反映
  occurred_days_ago: 7
  body: |
    先週決まった運用の変更を、関係する手順書のドキュメントへ反映した。
    まず全部を読んで、変更が効く箇所を探すところに一番時間がかかる。
    見つけた箇所だけを書き換え、変更した日付を末尾に足した。
    書き換える前に、どこを変えるつもりかを一覧で見せて確認してもらいたい。
- owner_subject: testuser
  type: work_log
  title: 作業ログ 週次レポートの下読み
  occurred_days_ago: 1
  body: |
    週次レポートに載せる4つの作業記録ドキュメントを開いて読んだ。所要 40 分。
- owner_subject: testuser
  type: work_log
  title: 作業ログ 議事録の下書き読み合わせ
  occurred_days_ago: 2
  body: |
    定例会議の下書きドキュメントを読み、決定事項に印を付けた。所要 25 分。
