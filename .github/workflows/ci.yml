name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps: &node_steps
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: node scripts/check-identifier-aliases.mjs
      - run: node scripts/check-create-app.mjs
      - run: node scripts/check-verifier-usage.mjs
  check-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/check-deps.mjs
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:unit
  integration:
    needs: unit
    runs-on: ubuntu-latest
    env: { SIGNER_MODE: local, VERTEX_MODE: fake, PUBSUB_MODE: inproc, STORE_MODE: emulator, NODE_ENV: test }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud components install cloud-firestore-emulator --quiet
      - run: gcloud emulators firestore start --host-port=127.0.0.1:8080 >/tmp/firestore.log 2>&1 &
      - run: pnpm install --frozen-lockfile && pnpm test:integration
  e2e:
    needs: unit
    runs-on: ubuntu-latest
    env: { SIGNER_MODE: local, VERTEX_MODE: fake, PUBSUB_MODE: inproc, STORE_MODE: emulator, NODE_ENV: test }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:e2e
  # The registers that describe the repository: which requirement each task answers,
  # which rules the platform deliberately does not keep, and what the terms mean. They
  # are checked on every change because a stale register is read as if it were current.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:requirements
      - run: pnpm check:deviations
      - run: pnpm check:glossary
      - run: pnpm check:docs-links
      - run: pnpm check:legacy-names
      # The generated rules table must already match its source.
      - run: pnpm gen:design-rules && git diff --exit-code docs/10-design-rules.md
  # The diagram is generated too, and from Python rather than Node. A drawing that has
  # drifted from its layout definition is the one artefact nobody notices going stale.
  diagrams:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # The PNG is left out: it is rendered by cairosvg, which is optional, so its bytes
      # depend on whether the runner happens to have it.
      - run: pnpm gen:diagrams && git diff --exit-code docs/diagrams/architecture.svg docs/diagrams/architecture.drawio
  # The strict variants open every path and grep every test name, so they need the
  # implementation to be complete. Required now that it is.
  docs-strict:
    needs: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:deviations:strict
      - run: pnpm check:glossary:strict
  boundary-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: node scripts/check-runtime-credentials.mjs
      - run: node scripts/check-no-dynamic-resolve.mjs
      - run: bash scripts/check-status-write-path.sh
      - run: bash scripts/check-bridge-raw-fetch.sh
      - run: bash scripts/check-bridge-no-refresh-token.sh
      - run: bash scripts/check-security-outbound.sh
      - run: for check in scripts/checks/*.sh; do bash "$check"; done
  # The committed generator output is what check-oidc-patches diffs the hand-written
  # OIDC sources against, so it has to be the CLI's output for the pinned version and
  # not a copy that drifted. generated-baseline/agent-op-reference is reference only:
  # Agent OP rebuilds the pipeline from the exported step functions (DEC-ID-01).
  generate-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm generate:baseline
      - run: git diff --exit-code generated-baseline
  check-oidc-patches:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: node scripts/check-oidc-patches.mjs
  infra-static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash infra/tests/run-static-checks.sh
