<rect x="60" y="570" width="1080" height="92" fill="#ffffff" stroke="#000000"/>
<text x="68.0" y="586.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" fill="#000000" font-weight="bold">FULL_ISOLATION</text>
<text x="68.0" y="600.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" fill="#000000">The left frame is created at run time by the Agent Provisioner and destroyed by Lifecycle Manager Cleanup. Terraform does not own it.</text>
<text x="68.0" y="613.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" fill="#000000">sa-agent-finance-001 may invoke dedicated-op-finance-001 and nothing else. sa-op-finance-001 may sign with the dedicated key only.</text>
<text x="68.0" y="626.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" fill="#000000">The dedicated ID-JAG key still sits in the shared issuer JWKS, so a leaked key forges the same range as a shared one.</text>
<text x="68.0" y="639.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" fill="#000000">What shrinks is how many Registrations and Refresh Tokens one breach reaches, not the forging power.</text>
<text x="68.0" y="652.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" fill="#000000">Dashed: created only when enable_google_bridge=true.</text>
</svg>