<text x="917.0" y="514.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#000000">Execution</text>
<text x="917.0" y="530.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#000000">1 Agent = 1 Execution of the shared Job definition</text>
<rect x="60" y="600" width="1060" height="80" fill="#ffffff" stroke="#000000"/>
<text x="68.0" y="616.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" fill="#000000" font-weight="bold">STANDARD</text>
<text x="68.0" y="630.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" fill="#000000">Shared: the OP process, and the Runtime Job definition with its Service Account. Not shared: the execution or the identity - 1 Agent = 1 Execution at either level.</text>
<text x="68.0" y="643.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" fill="#000000">Cloud Run IAM binds sa-agent-runtime to shared-agent-op, so Layer 1 is identical for every STANDARD Agent. Layer 2, the Agent Client Credential, tells them apart.</text>
<text x="68.0" y="656.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" fill="#000000">Blast radius: a compromised Shared OP reaches the signing key, and the Registration and Refresh Token of every STANDARD Agent.</text>
<text x="68.0" y="669.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" fill="#000000">Dashed: created only when enable_google_bridge=true.</text>
